<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f5" />

    <title>Roxane KIKI — Développeuse Web Fullstack</title>
    <meta name="description" content="Portfolio de Roxane KIKI, développeuse web fullstack en Île-de-France. Six projets React, JavaScript, Node.js et intégration web, avec le code source et le CV." />
    <meta name="author" content="Roxane KIKI" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Aperçu des partages. Les robots de LinkedIn, WhatsApp ou Slack n'exécutent
         pas le JavaScript : ces valeurs doivent rester en dur dans le HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roxane KIKI" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Roxane KIKI — Développeuse Web Fullstack" />
    <meta property="og:description" content="Six projets React, JavaScript et Node.js, avec le code source. Développeuse web fullstack en Île-de-France, disponible immédiatement." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roxane KIKI, développeuse web fullstack." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roxane KIKI — Développeuse Web Fullstack" />
    <meta name="twitter:description" content="Six projets React, JavaScript et Node.js, avec le code source. Développeuse web fullstack en Île-de-France." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/photos/portrait-cv.jpg" />
    <!-- Première photo du carrousel : c'est l'élément le plus grand du premier écran (LCP).
         La précharger évite d'attendre le JavaScript pour la découvrir. Garder en phase avec PhotoCarousel. -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/photos/portrait-aws-summit-600.webp" imagesrcset="/photos/portrait-aws-summit-600.webp 600w, /photos/portrait-aws-summit-1200.webp 1200w" imagesizes="(max-width: 760px) 256px, 288px" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Roxane KIKI",
        "jobTitle": "Développeuse Web Fullstack",
        "description": "Développeuse web fullstack, du frontend au backend : React, JavaScript, Node.js, Express et MongoDB.",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/photos/portrait-cv.jpg",
        "email": "mailto:kiroxane@gmail.com",
        "sameAs": [
          "https://github.com/kiroxane",
          "https://www.linkedin.com/in/roxanekiki-developpeur-web-informatique-paris/"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Île-de-France",
          "addressCountry": "FR"
        },
        "knowsLanguage": [
          { "@type": "Language", "name": "Français" },
          { "@type": "Language", "name": "Anglais" }
        ],
        "alumniOf": [
          { "@type": "EducationalOrganization", "name": "OpenClassrooms" },
          { "@type": "EducationalOrganization", "name": "ITIC Paris" }
        ],
        "knowsAbout": [
          "Développement web",
          "React",
          "JavaScript",
          "Node.js",
          "Express",
          "MongoDB",
          "API REST",
          "Intégration responsive",
          "Référencement naturel"
        ],
        "seeks": {
          "@type": "Demand",
          "name": "Poste de développeuse web en CDI, Île-de-France"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
