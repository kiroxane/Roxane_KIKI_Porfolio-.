<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Playfair Display';
    src: url('../node_modules/@fontsource-variable/playfair-display/files/playfair-display-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 400 900;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    gap: 72px;
    padding: 0 84px;
    background: #f7f8f5;
    color: #202623;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  /* Filet bleu signature, repris du bandeau du CV. */
  body::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 14px;
    background: #294bc6;
  }
  .copy { flex: 1; min-width: 0; }
  .role {
    color: #294bc6;
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.03em;
  }
  .intro {
    color: #5d665f;
    font-size: 27px;
    line-height: 1.45;
    margin-top: 26px;
    max-width: 30ch;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 34px; }
  .tags span {
    padding: 9px 20px;
    border: 1px solid #d7dcd6;
    border-radius: 999px;
    background: #fff;
    font-size: 21px;
    font-weight: 500;
  }
  .portrait {
    flex-shrink: 0;
    width: 340px;
    height: 430px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #d7dcd6;
    box-shadow: 0 20px 40px rgb(32 38 35 / 14%);
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <p class="role">Développeuse Web Fullstack</p>
    <h1>Roxane KIKI</h1>
    <p class="intro">Des interfaces aux API, je développe des projets web pour donner vie aux idées.</p>
    <div class="tags">
      <span>React</span><span>JavaScript</span><span>Node.js</span><span>MongoDB</span>
    </div>
  </div>
  <div class="portrait">
    <img src="../public/photos/portrait-cv.jpg" alt="">
  </div>
</body>
</html>
